<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atrocious(Gang Stash)</title>
    <style>
        /* ================= โทนสีและฟอนต์ ================= */
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap');

        :root {
            --bg-main: #09090b; --bg-panel: #18181b; --bg-hover: #27272a; 
            --border-color: #27272a; --text-main: #f4f4f5; --text-muted: #a1a1aa; 
            --accent-blue: #3b82f6; --accent-green: #10b981; --accent-red: #ef4444;
            --accent-gold: #ffcc00; --accent-orange: #f59e0b;
            --radius-md: 12px; --radius-lg: 16px;
        }

        body {
            font-family: 'Prompt', sans-serif; background-color: var(--bg-main); 
            color: var(--text-main); margin: 0; display: flex; flex-direction: column; 
            height: 100vh; box-sizing: border-box; -webkit-font-smoothing: antialiased;
        }

        /* ================= แถบเมนู (Navbar) ================= */
        .navbar {
            background-color: rgba(24, 24, 27, 0.8); backdrop-filter: blur(10px);
            padding: 0 40px; display: flex; gap: 8px; border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100; justify-content: center; align-items: center;
        }
        .nav-btn {
            background-color: transparent; color: var(--text-muted); border: none;
            padding: 20px 24px; cursor: pointer; font-size: 15px; font-weight: 500;
            transition: all 0.3s ease; border-bottom: 2px solid transparent; letter-spacing: 0.5px;
        }
        .nav-btn:hover { color: var(--text-main); }
        .nav-btn.active { color: var(--text-main); border-bottom: 2px solid var(--accent-blue); }

        /* ระบบซ่อน/แสดงปุ่มแอดมิน */
        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: flex !important; }
        body:not(.is-admin) .left-panel { flex: 1; max-width: 100%; }

        /* ================= โครงสร้างหน้าจอหลัก ================= */
        .page-content { 
            display: none; padding: 40px 20px; gap: 24px; overflow-y: auto;
            max-width: 1100px; margin: 0 auto; width: 100%; box-sizing: border-box; align-items: flex-start;
        }
        .page-content.active { display: flex; }

        .panel {
            background-color: var(--bg-panel); border-radius: var(--radius-lg); 
            padding: 32px; display: flex; flex-direction: column; 
            border: 1px solid var(--border-color); box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .left-panel { flex: 1.6; transition: 0.3s; }
        .right-panel { flex: 1; min-width: 300px; position: sticky; top: 20px;}
        .full-panel { flex: 1; width: 100%; }

        h2 { margin: 0 0 8px 0; font-size: 22px; font-weight: 600; color: #fff;}
        h3 { margin: 32px 0 16px 0; font-size: 16px; font-weight: 500; color: var(--text-muted); }
        p.subtitle { color: var(--text-muted); font-size: 14px; margin-top: 0; margin-bottom: 24px; font-weight: 300;}

        /* ================= ฟอร์มและปุ่ม ================= */
